<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">VeriModern verification-first architecture</title>
  <desc id="description">A layered architecture diagram showing the user, GitHub, VeriModern web application, local agent controller, Daytona sandbox, verification gates, and pull request outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8faff"/>
      <stop offset="1" stop-color="#edf1ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1">
      <stop stop-color="#111a35"/>
      <stop offset="1" stop-color="#263661"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24345f" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6677ca"/>
    </marker>
    <style>
      .heading { font: 700 36px Arial, Helvetica, sans-serif; fill:#111a35; letter-spacing:-.7px; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill:#53617d; }
      .layer { font: 700 15px Arial, Helvetica, sans-serif; fill:#6d7dff; letter-spacing:2.3px; }
      .cardtitle { font: 700 20px Arial, Helvetica, sans-serif; fill:#18233f; }
      .body { font: 400 15px Arial, Helvetica, sans-serif; fill:#485774; }
      .small { font: 400 14px Arial, Helvetica, sans-serif; fill:#596987; }
      .whiteTitle { font: 700 20px Arial, Helvetica, sans-serif; fill:#fff; }
      .whiteBody { font: 400 15px Arial, Helvetica, sans-serif; fill:#dbe5ff; }
      .pill { font: 700 13px Arial, Helvetica, sans-serif; fill:#435294; letter-spacing:.5px; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect x="48" y="36" width="1504" height="908" rx="30" fill="#fff" filter="url(#shadow)"/>

  <text x="102" y="104" class="heading">VeriModern Architecture</text>
  <text x="102" y="136" class="subtitle">Can an LLM transform legacy code with verifiable results?</text>
  <rect x="1208" y="79" width="270" height="38" rx="19" fill="#e8ecff"/>
  <text x="1232" y="104" class="pill">POC: LEGACY TRANSFORMATION</text>

  <!-- External actors -->
  <text x="102" y="205" class="layer">EXTERNAL SERVICES</text>
  <g filter="url(#shadow)">
    <rect x="102" y="230" width="260" height="120" rx="18" fill="#f7f9ff" stroke="#ccd5ef" stroke-width="2"/>
    <circle cx="142" cy="270" r="20" fill="#6d7dff"/>
    <circle cx="142" cy="264" r="7" fill="#fff"/><path d="M128 286c2-10 26-10 28 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="178" y="271" class="cardtitle">User</text>
    <text x="178" y="296" class="body">Selects repository, scope,</text>
    <text x="178" y="318" class="body">and target version</text>

    <rect x="1236" y="230" width="260" height="120" rx="18" fill="#f7f9ff" stroke="#ccd5ef" stroke-width="2"/>
    <circle cx="1276" cy="270" r="20" fill="#17213f"/>
    <path d="M1264 273c0-9 6-15 12-15s12 6 12 15v8c-3 2-5 4-7 7h-10c-2-3-4-5-7-7z" fill="#fff"/>
    <text x="1312" y="271" class="cardtitle">GitHub</text>
    <text x="1312" y="296" class="body">App authorization, repository</text>
    <text x="1312" y="318" class="body">access, branch, and PR</text>
  </g>

  <!-- Web application -->
  <text x="102" y="424" class="layer">WEB APPLICATION · NEXT.JS + REACT + TYPESCRIPT</text>
  <g filter="url(#shadow)">
    <rect x="102" y="450" width="1394" height="148" rx="22" fill="url(#hero)"/>
    <text x="136" y="486" class="whiteTitle">VeriModern</text>
    <text x="136" y="510" class="whiteTitle">Web App</text>
    <text x="136" y="543" class="whiteBody">Authorized repository → scoped</text>
    <text x="136" y="564" class="whiteBody">transformation → verified PR</text>
    <line x1="442" y1="474" x2="442" y2="570" stroke="#53699d"/>
    <line x1="771" y1="474" x2="771" y2="570" stroke="#53699d"/>
    <line x1="1100" y1="474" x2="1100" y2="570" stroke="#53699d"/>
    <text x="474" y="486" class="whiteTitle">Repository</text>
    <text x="474" y="510" class="whiteTitle">Scanner</text>
    <text x="474" y="543" class="whiteBody">Build files, versions, and</text><text x="474" y="564" class="whiteBody">selectable paths</text>
    <text x="803" y="486" class="whiteTitle">Run</text>
    <text x="803" y="510" class="whiteTitle">Orchestrator</text>
    <text x="803" y="543" class="whiteBody">Creates a work order and</text><text x="803" y="564" class="whiteBody">streams secure updates</text>
    <text x="1132" y="486" class="whiteTitle">PR and</text>
    <text x="1132" y="510" class="whiteTitle">Results</text>
    <text x="1132" y="543" class="whiteBody">Creates a reviewable PR</text><text x="1132" y="564" class="whiteBody">and change summaries</text>
  </g>

  <!-- Agent and sandbox -->
  <text x="102" y="665" class="layer">EXECUTION AND VERIFICATION</text>
  <g filter="url(#shadow)">
    <rect x="102" y="690" width="376" height="176" rx="20" fill="#f1f4ff" stroke="#c8d2f0" stroke-width="2"/>
    <rect x="126" y="716" width="134" height="28" rx="14" fill="#dce3ff"/>
    <text x="147" y="736" class="pill">LOCAL CONTROLLER</text>
    <text x="126" y="778" class="cardtitle">Claude CLI Agent</text>
    <text x="126" y="807" class="body">Receives a scoped work order.</text>
    <text x="126" y="831" class="body">Creates and supervises the</text>
    <text x="126" y="853" class="body">isolated Daytona execution.</text>

    <rect x="578" y="690" width="572" height="176" rx="20" fill="#f8fbff" stroke="#c8d2f0" stroke-width="2"/>
    <rect x="602" y="716" width="150" height="28" rx="14" fill="#dff5ed"/>
    <text x="627" y="736" class="pill">ISOLATED SANDBOX</text>
    <text x="602" y="778" class="cardtitle">Daytona Workspace</text>
    <text x="602" y="805" class="body">Clone repository and inspect source and build files</text>
    <text x="602" y="827" class="body">Apply the selected modernization</text>
    <text x="602" y="849" class="body">Run baseline and target verification; return scoped evidence</text>

    <rect x="1250" y="690" width="246" height="176" rx="20" fill="#effaf5" stroke="#b8e3cd" stroke-width="2"/>
    <text x="1276" y="733" class="pill">ACCEPTANCE GATES</text>
    <text x="1276" y="775" class="cardtitle">Verification</text>
    <text x="1276" y="804" class="body">Clean build</text>
    <text x="1276" y="828" class="body">Automated tests</text>
    <text x="1276" y="852" class="body">Target version check</text>
  </g>

  <!-- arrows -->
  <path d="M362 290 H560 V450" fill="none" stroke="#6677ca" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1236 290 H1160 V450" fill="none" stroke="#6677ca" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M800 598 V630 H520 V690" fill="none" stroke="#6677ca" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M478 778 H570" fill="none" stroke="#6677ca" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1150 778 H1242" fill="none" stroke="#6677ca" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1373 690 V635 H1450 V598" fill="none" stroke="#3a9b73" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1250 646 H1508 V350 H1496" fill="none" stroke="#3a9b73" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="102" y="916" class="small">Current gate: baseline and final build/tests, target checks, and PR review. Planned: automatic characterization and behavioral comparison.</text>
</svg>
